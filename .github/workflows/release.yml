name: Release

# Pushing a tag like v1.0.0 builds the Windows installer and the Linux AppImage and .deb, and
# publishes them as a GitHub Release. The tag must match the version in src-tauri/tauri.conf.json.
# Run by hand (workflow_dispatch), it only builds for Linux, to try that build without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      # Updates are signed with the key in this secret; installed copies check
      # the signature before installing anything.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      # The installer keeps the same name in every release, so
      # .../releases/latest/download/DuckNotes-Setup.exe always works.
      # latest.json tells installed copies about the new version.
      - name: Publish the installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp src-tauri/target/release/bundle/nsis/*-setup.exe DuckNotes-Setup.exe
          node scripts/update-manifest.mjs src-tauri/target/release/bundle/nsis/*-setup.exe.sig \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/DuckNotes-Setup.exe" latest.json
          gh release create "$GITHUB_REF_NAME" DuckNotes-Setup.exe latest.json \
            --title "DuckNotes ${GITHUB_REF_NAME#v}" \
            --notes-file .github/release-notes.md

  # After the Windows release: the AppImage (which updates itself, as the Windows version does)
  # and a .deb, added to the same release, and latest.json told about the AppImage too.
  linux:
    needs: windows
    if: always() && (needs.windows.result == 'success' || (needs.windows.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install what Tauri needs on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm test

      - run: npm run tauri build -- --bundles appimage,deb
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

      - name: Name the files the same in every release
        run: |
          cp src-tauri/target/release/bundle/appimage/*.AppImage DuckNotes-x86_64.AppImage
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig DuckNotes-x86_64.AppImage.sig
          cp src-tauri/target/release/bundle/deb/*.deb DuckNotes-amd64.deb
          ls -l DuckNotes-*

      # A build run by hand keeps its files for a few days, to try them.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: DuckNotes-*
          retention-days: 3

      - name: Add them to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$GITHUB_REF_NAME" -p latest.json
          node scripts/update-manifest.mjs DuckNotes-x86_64.AppImage.sig \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/DuckNotes-x86_64.AppImage" latest.json linux-x86_64
          gh release upload "$GITHUB_REF_NAME" DuckNotes-x86_64.AppImage DuckNotes-amd64.deb latest.json --clobber
