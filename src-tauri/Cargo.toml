[package]
name = "ducknotes"
version = "1.8.1"
description = "Notes for lectures and meetings, kept on your own computer"
authors = ["Duckrice"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "ducknotes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
percent-encoding = "2"
# Needed by tauri::generate_context! once plugins have settings in tauri.conf.json.
serde_json = "1"
# Windows' own Save dialog, for exports (the path comes from the dialog, never from the page).
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# Windows' own spell checker, in every language the user has (Norwegian and English at once).
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Com", "System_UserProfile"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
